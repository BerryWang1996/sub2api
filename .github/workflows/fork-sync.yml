name: Fork upstream sync

# Manual only: upstream and destination are deliberately fixed, not user input.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'BerryWang1996/sub2api' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout fork main with complete history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream into a fork-only review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          repo='BerryWang1996/sub2api'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          # Fetch-only upstream: never push to the source repository.
          git remote set-url --push upstream DISABLED
          git fetch --no-tags upstream '+refs/heads/main:refs/remotes/upstream/main'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git checkout -B main origin/main
          upstream_sha="$(git rev-parse upstream/main)"
          branch="sync/upstream-${upstream_sha:0:12}"

          {
            echo '## Fork-only upstream synchronization'
            printf '\nUpstream: Wei-Shaw/sub2api@%s\n' "$upstream_sha"
            echo 'Destination: BerryWang1996/sub2api, base main.'
            echo
            echo '**Validation required:** PRs and pushes created with GITHUB_TOKEN do not automatically trigger other workflows. Run the fork release workflow preflight explicitly against the full synchronized HEAD SHA before publishing; do not treat this merge-only workflow as CI or image validation.'
          } >> "$GITHUB_STEP_SUMMARY"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo 'No changes: fork main already contains this upstream commit.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing_pr="$(gh pr list --repo "$repo" --base main --head "$branch" \
            --state open --json url,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false) | .url')"
          if [[ -n "$existing_pr" ]]; then
            printf '\nExisting internal PR (reused, not overwritten): %s\n' "$existing_pr" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A previous run may have pushed successfully but failed to open its PR.
          # Resume that branch without reset/force-push, preserving any fork edits.
          remote_branch="$(git ls-remote --heads origin "refs/heads/$branch")"
          if [[ -n "$remote_branch" ]]; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -b "$branch" "origin/$branch"
          else
            git checkout -b "$branch" origin/main
          fi

          merge_or_fail() {
            local target="$1" message="$2"
            if ! git merge --no-edit -m "$message" "$target"; then
              {
                echo
                echo '### Merge failed — nothing was pushed'
                echo 'Resolve the merge manually on a fork branch, preserving fork customizations. No reset, automatic conflict resolution, force push, or push to main was attempted.'
                echo 'Conflicted paths:'
                echo '```text'
                git diff --name-only --diff-filter=U
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              git status --short
              git diff --name-only --diff-filter=U
              echo '::error::Merge failed. Resolve manually; remote branches and fork main were not changed.'
              exit 1
            fi
          }

          # On resume, include the latest fork patches before merging upstream.
          merge_or_fail origin/main "$(printf 'Merge fork main into upstream sync branch\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>')"
          merge_or_fail upstream/main "$(printf 'Merge Wei-Shaw/sub2api main (%s)\n\nCo-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>' "$upstream_sha")"
          git merge-base --is-ancestor origin/main HEAD
          git merge-base --is-ancestor "$upstream_sha" HEAD
          merged_sha="$(git rev-parse HEAD)"
          printf '\nSynchronized full HEAD SHA: %s\n' "$merged_sha" >> "$GITHUB_STEP_SUMMARY"

          # The only push destination is a review branch in this fork.
          git push origin "HEAD:refs/heads/$branch"
          body_file="$RUNNER_TEMP/fork-sync-pr-body.txt"
          cat > "$body_file" <<EOF
          ## Fork-only upstream synchronization

          Merge Wei-Shaw/sub2api main at $upstream_sha into the fork's main history, preserving fork patches. This PR targets BerryWang1996/sub2api:main only; it is not a contribution PR to upstream.

          Synchronized full HEAD SHA: $merged_sha

          ## Required manual validation

          GITHUB_TOKEN-created PRs and pushes do not automatically trigger other workflows. This workflow only performs a merge; it does not validate application code or images. Explicitly run the fork release workflow preflight against the full current PR HEAD SHA before publishing, and rerun validation after any new commits. Check the fork image workflow's own test/preflight results; do not assume automatic CI ran or bypass those checks.

          If PR creation is blocked, enable GitHub Actions PR creation through the repository owner's normal approval process or manually open an internal PR from this existing branch. No PAT is required or used by this workflow.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          if pr_url="$(gh pr create --repo "$repo" --base main --head "$branch" \
            --title "Sync upstream main (${upstream_sha:0:12})" --body-file "$body_file")"; then
            printf '\nCreated internal PR: %s\n' "$pr_url" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            printf '\nPR creation failed; the fork branch %s is preserved. Open an internal PR to fork main manually, or retry this workflow after the repository owner approves Actions PR creation.\n' "$branch" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
